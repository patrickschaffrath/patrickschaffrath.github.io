<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {% include styles.html %} {% seo %}
  </head>
  <body class="d-flex flex-column min-vh-100">
    {% include navbar.html %}

    <main class="d-flex justify-content-center">
      <div class="main-container w-100">
        <div class="text-container">
          <h1 class="story-title{% if page.subtitle %} has-subtitle{% endif %}">
            {{ page.title }}
          </h1>
          {% if page.subtitle %}
          <p class="story-subtitle">{{ page.subtitle }}</p>
          {% endif %}
          <article class="story">{{ content }}</article>
          <p class="story-byline">by Patrick Schaffrath</p>
        </div>
      </div>
    </main>
  </body>
</html>
